name: Reusable CLA signature validation

on:
  workflow_call:
    inputs:
      cla_root:
        required: false
        type: string
        default: .
      implementation_repository:
        required: false
        type: string
        default: conveyal/CLA-Ledger
      implementation_ref:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate signature
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted caller base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check out pinned CLA implementation
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.implementation_repository }}
          ref: ${{ inputs.implementation_ref }}
          path: .cla-ledger
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: .cla-ledger
          install: false
      - name: Validate signature records
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLA_ROOT: ${{ inputs.cla_root }}
        run: node .cla-ledger/.github/scripts/validate_signatures.ts
