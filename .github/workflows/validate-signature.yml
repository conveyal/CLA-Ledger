name: Validate signature
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['*/signatures/**']

# Validates a contributor's signature PR. Identity is the AUTHENTICATED account
# that opens the PR (login + numeric id, from the event payload). The check
# logic is in .github/scripts/validate_signatures.py; it fetches the PR's file
# content via the API and never checks out or runs PR code. We check out the
# BASE branch (trusted main) only, to run the script and read the canonical
# versions/CLA-*.md.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out base (trusted main, not PR head)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate signature(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validate_signatures.py
