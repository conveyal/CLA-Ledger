name: Reusable CLA contributor check

on:
  workflow_call:
    inputs:
      ledger_repository:
        required: false
        type: string
        default: conveyal/CLA-Ledger
      ledger_data_ref:
        required: false
        type: string
        default: main
      implementation_repository:
        required: false
        type: string
        default: conveyal/CLA-Ledger
      implementation_ref:
        required: true
        type: string
      signing_url:
        required: true
        type: string
      signature_path_prefix:
        required: false
        type: string
        default: signatures/
      signature_only_pr:
        required: false
        type: boolean
        default: false
      pr_number:
        required: false
        type: string
        default: ''
      personalized_signing_links:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check:
    name: Check contributor coverage
    runs-on: ubuntu-latest
    concurrency:
      group: cla-${{ github.repository }}-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out pinned CLA implementation
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.implementation_repository }}
          ref: ${{ inputs.implementation_ref }}
          path: .cla-ledger
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: .cla-ledger
          install: false
      - name: Resolve the current PR and start its CLA check
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node .cla-ledger/.github/scripts/prepare_check.ts
      - name: Check out trusted caller base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: .cla-caller-base
          persist-credentials: false
      - name: Check out trusted CLA ledger data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.ledger_repository }}
          ref: ${{ inputs.ledger_data_ref }}
          path: .cla-ledger-data
          persist-credentials: false
      - name: Check contributor coverage
        if: ${{ always() && steps.pr.outputs.check_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          CHECK_ID: ${{ steps.pr.outputs.check_id }}
          PREVIOUS_STATUS: ${{ job.status }}
          CLA_ROOT: .cla-ledger-data
          SIGNATURE_PATH_PREFIX: ${{ inputs.signature_path_prefix }}
          SIGNATURE_ONLY_PR: ${{ inputs.signature_only_pr }}
          SIGNING_URL: ${{ inputs.signing_url }}
          EDITOR_LINKS: ${{ inputs.personalized_signing_links }}
        run: node .cla-ledger/.github/scripts/run_check.ts
