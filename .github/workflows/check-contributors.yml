name: Reusable CLA contributor check

on:
  workflow_call:
    inputs:
      ledger_repository:
        required: false
        type: string
        default: conveyal/CLA-Ledger
      ledger_data_ref:
        required: false
        type: string
        default: main
      implementation_repository:
        required: false
        type: string
        default: conveyal/CLA-Ledger
      implementation_ref:
        required: true
        type: string
      signing_url:
        required: true
        type: string
      signature_path_prefix:
        required: false
        type: string
        default: signatures/
      signature_only_pr:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check contributor coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted caller base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check out trusted CLA ledger data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.ledger_repository }}
          ref: ${{ inputs.ledger_data_ref }}
          path: .cla-ledger-data
          persist-credentials: false
      - name: Check out pinned CLA implementation
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.implementation_repository }}
          ref: ${{ inputs.implementation_ref }}
          path: .cla-ledger
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: .cla-ledger
          install: false
      - name: Check contributor coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLA_ROOT: .cla-ledger-data
          SIGNATURE_PATH_PREFIX: ${{ inputs.signature_path_prefix }}
          SIGNATURE_ONLY_PR: ${{ inputs.signature_only_pr }}
          SIGNING_URL: ${{ inputs.signing_url }}
        run: node .cla-ledger/.github/scripts/check_cla.ts
